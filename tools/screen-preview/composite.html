<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
body{margin:0;background:#1a1d24;font-family:Inter,sans-serif;color:#fff}
.wrap{display:flex;gap:28px;padding:36px 36px 28px}
figure{margin:0;text-align:center}
img{width:300px;border-radius:34px;border:8px solid #000;box-shadow:0 12px 30px rgba(0,0,0,.45)}
figcaption{margin-top:14px;font-size:17px;font-weight:600}
small{display:block;margin-top:4px;font-size:13px;color:#a3a3a3;font-weight:400}
p{margin:0 36px 30px;color:#a3a3a3;font-size:14px}
</style></head><body><div class="wrap" id="wrap"></div><p id="note"></p>
<script>
const sets = {
  creator: [["own", "Your page", "Story ring, Insights only you see"], ["own-no-story", "Your page, no Story yet", "\"+\" on the photo starts one"], ["other", "Someone else's page", "Follows you, Follow back, Message"], ["private", "Private account", "Who they are, nothing they share"], ["more", "More", "Share, copy link, mute, block, report"]],
  edit: [["edit", "Edit Profile", "Counters, live username check"], ["crop", "Move and scale", "The new photo, before cutting"], ["crop-zoomed", "Zoomed in", "Drag, pinch or the buttons"]],
};
const set = new URLSearchParams(location.search).get("set") || "creator";
document.getElementById("wrap").innerHTML = sets[set].map(([f, t, s]) => `<figure><img src="shots/${f}.png"><figcaption>${t}<small>${s}</small></figcaption></figure>`).join("");
document.getElementById("note").textContent = (set === "edit" ? "Katkee Edit Profile, Phase 11." : "Katkee creator page, Phase 10.") + " The app's own screen code rendered with React Native for Web in Chromium, sample data and pictures. Not a device screenshot: fonts and native details differ slightly on iPhone and Android.";
</script>
</body></html>
