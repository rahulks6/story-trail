<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{url}}">
<meta name="theme-color" content="#0B0B0B">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{asset:katkee-icon.svg}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="{{asset:site.css}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{origin}}{{asset:social-card.png}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="The Katkee app icon">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="page-{{body}}">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
<div class="wrap header-row">
<a class="brand" href="/" aria-label="Katkee home">
<img class="brand-icon" src="{{asset:katkee-icon.svg}}" width="34" height="34" alt="">
<span class="wordmark" aria-hidden="true"><span class="kat">Kat</span><span class="kee">kee</span></span>
</a>
<nav class="site-nav" aria-label="Main">
<a href="/#features">Features</a>
<a href="/#safety">Safety</a>
<a href="/support"{{current:/support}}>Help</a>
</nav>
</div>
</header>
<main id="main">
{{{content}}}
</main>
<footer class="site-footer">
<div class="wrap footer-grid">
<div class="footer-brand">
<a class="brand" href="/" aria-label="Katkee home">
<img class="brand-icon" src="{{asset:katkee-icon.svg}}" width="28" height="28" alt="">
<span class="wordmark" aria-hidden="true"><span class="kat">Kat</span><span class="kee">kee</span></span>
</a>
<p>{{site.tagline}}</p>
</div>
<nav class="footer-links" aria-label="Footer">
<a href="/support"{{current:/support}}>Help Center</a>
<a href="/privacy"{{current:/privacy}}>Privacy Policy</a>
<a href="/terms"{{current:/terms}}>Terms of Service</a>
<a href="/delete-account"{{current:/delete-account}}>Delete your account</a>
</nav>
<div class="footer-contact">
<p>Questions? <a href="mailto:{{contact.support}}">{{contact.support}}</a></p>
</div>
</div>
<div class="wrap footer-legal">
<p>&copy; {{site.copyrightYear}} {{site.name}}</p>
</div>
</footer>
</body>
</html>
