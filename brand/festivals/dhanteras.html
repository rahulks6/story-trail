<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Tiro+Devanagari+Hindi&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold: #FFC800; --amber: #FCB020; --deep: #FF8A00; --bg: #0B0B0B; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  .card {
    position: relative; overflow: hidden; width: 1080px; height: var(--h);
    background:
      radial-gradient(ellipse 70% 45% at 50% var(--glowY), rgba(255,170,0,0.30), rgba(255,120,0,0.08) 55%, transparent 75%),
      radial-gradient(ellipse 120% 60% at 50% 110%, #2a1300 0%, transparent 60%),
      linear-gradient(180deg, #120a02 0%, #0B0B0B 45%, #0d0703 100%);
    font-family: Inter, sans-serif; color: #fff;
  }
  svg.layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; }
  .hindi { font-family: "Tiro Devanagari Hindi", serif; color: var(--gold); text-shadow: 0 0 30px rgba(255,170,0,0.55); line-height: 1.25; }
  .english { font-family: Cinzel, serif; font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
    background: linear-gradient(180deg, #FFF3C4 0%, #FFC800 45%, #FF8A00 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(255,140,0,0.35)); }
  .rule { display: flex; align-items: center; gap: 18px; color: var(--gold); }
  .rule i { display: block; height: 2px; width: 150px; background: linear-gradient(90deg, transparent, var(--gold)); }
  .rule i:last-child { transform: scaleX(-1); }
  .rule b { width: 12px; height: 12px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 14px var(--gold); }
  .wish { color: rgba(255,255,255,0.88); text-align: center; font-weight: 500; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { height: 64px; }
  .word { font-weight: 800; font-size: 54px; letter-spacing: -0.5px; }
  .word span { color: var(--gold); }
  .tag { color: rgba(255,255,255,0.6); font-size: 24px; letter-spacing: 1px; margin-top: 6px; }
</style>
</head>
<body>
<div class="card" id="card">
  <svg class="layer" id="bg" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="content" id="content"></div>
</div>
<script>
const P = new URLSearchParams(location.search);
const story = P.get("f") !== "post";
const W = 1080, H = story ? 1920 : 1350;
const card = document.getElementById("card");
card.style.setProperty("--h", H + "px");
card.style.setProperty("--glowY", story ? "60%" : "64%");
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("bg");
svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// Defs
const defs = el("defs", {});
defs.innerHTML = `
  <radialGradient id="flame" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.25" stop-color="#FFF2A8"/><stop offset="0.6" stop-color="#FFB000"/><stop offset="1" stop-color="#FF5A00"/></radialGradient>
  <radialGradient id="halo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFD24A" stop-opacity="0.75"/><stop offset="0.4" stop-color="#FF9A00" stop-opacity="0.25"/><stop offset="1" stop-color="#FF7A00" stop-opacity="0"/></radialGradient>
  <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E0782E"/><stop offset="0.5" stop-color="#B4501C"/><stop offset="1" stop-color="#6E2A0C"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFC800"/><stop offset="0.5" stop-color="#FFF0A0"/><stop offset="1" stop-color="#FF9A00"/></linearGradient>
  <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE68A"/><stop offset="0.45" stop-color="#FFC21A"/><stop offset="1" stop-color="#B87400"/></linearGradient>
  <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D99200"/><stop offset="1" stop-color="#7A4A00"/></linearGradient>
  <radialGradient id="petal" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#FFD000"/><stop offset="0.7" stop-color="#FF9500"/><stop offset="1" stop-color="#E06A00"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>`;

// Deterministic random
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Faint rangoli mandala behind everything
const cx = W / 2, cy = story ? 1150 : 830;
const mand = el("g", { opacity: 0.16, stroke: "#FFC800", fill: "none", "stroke-width": 2 });
[150, 230, 310, 400, 470].forEach((r, ri) => {
  el("circle", { cx, cy, r, "stroke-dasharray": ri % 2 ? "4 10" : "" }, mand);
  const n = 12 + ri * 6;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, a2 = ((i + 0.5) / n) * Math.PI * 2;
    const r2 = r + (ri === 4 ? 40 : 34);
    const x1 = cx + Math.cos(a) * r, y1 = cy + Math.sin(a) * r;
    const x3 = cx + Math.cos(a + (Math.PI * 2) / n) * r, y3 = cy + Math.sin(a + (Math.PI * 2) / n) * r;
    const x2 = cx + Math.cos(a2) * r2, y2 = cy + Math.sin(a2) * r2;
    if (ri < 4) el("path", { d: `M${x1},${y1} Q${x2},${y2} ${x3},${y3}` }, mand);
    else el("circle", { cx: x2, cy: y2, r: 6 }, mand);
  }
});

// Marigold toran across the top
const toran = el("g", {});
const ty = 0, swags = 5, sw = W / swags;
for (let s = 0; s < swags; s++) {
  const x0 = s * sw, depth = 90;
  for (let k = 0; k <= 14; k++) {
    const t = k / 14, x = x0 + t * sw, y = ty + 16 + Math.sin(t * Math.PI) * depth;
    // leaves
    if (k % 3 === 1) {
      el("ellipse", { cx: x, cy: y + 26, rx: 9, ry: 22, fill: "#2F7D32", transform: `rotate(${rnd() * 40 - 20} ${x} ${y + 26})` }, toran);
    }
    el("circle", { cx: x, cy: y, r: 17, fill: "url(#petal)" }, toran);
    el("circle", { cx: x, cy: y, r: 17, fill: "none", stroke: "#C25400", "stroke-width": 2, "stroke-dasharray": "3 4", opacity: 0.6 }, toran);
  }
  // hanging tassel strand from each joint
  const hx = x0;
  if (s > 0) {
    for (let k = 0; k < 5; k++) el("circle", { cx: hx, cy: 40 + k * 30, r: 14 - k, fill: k % 2 ? "#FF7A00" : "#FFC400" }, toran);
    el("ellipse", { cx: hx, cy: 40 + 5 * 30 + 6, rx: 8, ry: 18, fill: "#2F7D32" }, toran);
  }
}

// Sparkles and floating embers
for (let i = 0; i < (story ? 70 : 50); i++) {
  const x = rnd() * W, y = 220 + rnd() * (H - 300), r = 1 + rnd() * 3;
  el("circle", { cx: x, cy: y, r, fill: rnd() > 0.5 ? "#FFE08A" : "#FFB000", opacity: 0.25 + rnd() * 0.6 }, svg);
}
const star = (x, y, s, o) => el("path", { d: `M${x},${y - s} Q${x},${y} ${x + s},${y} Q${x},${y} ${x},${y + s} Q${x},${y} ${x - s},${y} Q${x},${y} ${x},${y - s}Z`, fill: "#FFF1B0", opacity: o }, svg);
(story
  ? [[150, 520, 22], [930, 600, 28], [120, 1480, 18], [970, 1380, 20], [860, 380, 14], [230, 960, 14], [880, 1030, 16]]
  : [[90, 600, 18], [990, 620, 22], [110, 1000, 16], [980, 950, 18]]).forEach(([x, y, s]) => star(x, y, s, 0.9));

// Main illustration: diya on a pile of gold coins
const ill = el("g", { transform: `translate(${cx} ${cy + (story ? 40 : 30)}) scale(${story ? 1 : 0.82})` });
el("ellipse", { cx: 0, cy: -60, rx: 330, ry: 300, fill: "url(#halo)" }, ill);

// Coins: back row, scattered, then stacks
const coin = (x, y, r, tilt = 0.32, stack = 1) => {
  const g = el("g", {}, ill);
  for (let i = stack - 1; i >= 0; i--) {
    const yy = y - i * r * 0.22;
    el("ellipse", { cx: x, cy: yy + r * 0.1, rx: r, ry: r * tilt, fill: "url(#coinEdge)" }, g);
    el("ellipse", { cx: x, cy: yy, rx: r, ry: r * tilt, fill: "url(#coin)" }, g);
    el("ellipse", { cx: x, cy: yy, rx: r * 0.72, ry: r * tilt * 0.72, fill: "none", stroke: "#B87400", "stroke-width": 2, opacity: 0.7 }, g);
  }
  return g;
};
coin(-250, 150, 58, 0.32, 5);
coin(255, 160, 54, 0.32, 4);
coin(-160, 175, 50, 0.32, 2);
coin(170, 182, 46, 0.32, 2);
[[-330, 205, 34], [340, 210, 32], [-60, 215, 40], [70, 222, 38], [-230, 228, 30], [240, 232, 28], [0, 240, 30]].forEach(([x, y, r]) => coin(x, y, r));
// standing coin with ₹-free rupee-like mark: a simple lotus emboss
const stand = el("g", { transform: "translate(300 70) rotate(12)" }, ill);
el("ellipse", { cx: 5, cy: 0, rx: 46, ry: 50, fill: "url(#coinEdge)" }, stand);
el("ellipse", { cx: 0, cy: 0, rx: 46, ry: 50, fill: "url(#coin)" }, stand);
el("ellipse", { cx: 0, cy: 0, rx: 34, ry: 37, fill: "none", stroke: "#B87400", "stroke-width": 2.5 }, stand);
el("path", { d: "M0,-20 C10,-8 10,8 0,20 C-10,8 -10,-8 0,-20Z M-18,12 C-14,-2 -4,4 0,20 C-8,20 -16,18 -18,12Z M18,12 C14,-2 4,4 0,20 C8,20 16,18 18,12Z", fill: "#C98300" }, stand);

// Diya
const diya = el("g", { transform: "translate(0 40)" }, ill);
el("ellipse", { cx: 0, cy: 70, rx: 190, ry: 26, fill: "#000", opacity: 0.35, filter: "url(#blur)" }, diya);
el("path", { d: "M-185,-10 C-150,95 150,95 185,-10 C230,-25 265,-55 270,-70 C220,-40 170,-30 120,-28 L-120,-28 C-150,-28 -175,-22 -185,-10Z", fill: "url(#clay)" }, diya);
el("ellipse", { cx: 0, cy: -20, rx: 186, ry: 36, fill: "#3A1606" }, diya);
el("ellipse", { cx: 0, cy: -16, rx: 160, ry: 26, fill: "#8A5A10", opacity: 0.85 }, diya);
el("ellipse", { cx: 0, cy: -20, rx: 186, ry: 36, fill: "none", stroke: "url(#rim)", "stroke-width": 7 }, diya);
// painted band on diya
const band = el("g", { fill: "#FFC800" }, diya);
for (let i = -5; i <= 5; i++) { const x = i * 28, y = 30 - Math.abs(i) * Math.abs(i) * 1.1; el("circle", { cx: x, cy: y, r: 6 }, band); el("path", { d: `M${x - 10},${y + 14} L${x},${y + 24} L${x + 10},${y + 14}`, fill: "none", stroke: "#FFE27A", "stroke-width": 3 }, band); }
// wick + flame at the spout
el("path", { d: "M228,-50 C238,-62 246,-70 250,-78", stroke: "#2a1205", "stroke-width": 8, "stroke-linecap": "round", fill: "none" }, diya);
el("ellipse", { cx: 252, cy: -150, rx: 120, ry: 150, fill: "url(#halo)" }, diya);
el("path", { d: "M252,-250 C290,-185 300,-120 252,-80 C205,-120 214,-185 252,-250Z", fill: "url(#flame)" }, diya);
el("path", { d: "M252,-185 C268,-150 270,-115 252,-95 C234,-115 236,-150 252,-185Z", fill: "#FFFFFF", opacity: 0.85 }, diya);

// Small diyas on the sides
const mini = (x, y, s) => {
  const g = el("g", { transform: `translate(${x} ${y}) scale(${s})` }, svg);
  el("ellipse", { cx: 0, cy: -80, rx: 90, ry: 110, fill: "url(#halo)" }, g);
  el("path", { d: "M-70,0 C-55,45 55,45 70,0 C40,-6 -40,-6 -70,0Z", fill: "url(#clay)" }, g);
  el("ellipse", { cx: 0, cy: -2, rx: 70, ry: 12, fill: "none", stroke: "url(#rim)", "stroke-width": 4 }, g);
  el("path", { d: "M0,-90 C22,-55 24,-25 0,-8 C-24,-25 -22,-55 0,-90Z", fill: "url(#flame)" }, g);
};
if (story) { mini(140, 1640, 0.95); mini(940, 1640, 0.95); }
else { mini(110, 1170, 0.75); mini(970, 1170, 0.75); }

// Text and brand
const content = document.getElementById("content");
content.innerHTML = story ? `
  <div style="height:250px"></div>
  <div class="hindi" style="font-size:96px">शुभ धनतेरस</div>
  <div style="height:22px"></div>
  <div class="english" style="font-size:94px; line-height:1.05; text-align:center">Happy<br>Dhanteras</div>
  <div style="height:36px"></div>
  <div class="rule"><i></i><b></b><i></i></div>
  <div style="height:30px"></div>
  <div class="wish" style="font-size:36px; line-height:1.45; max-width:820px">May your home shine with gold,<br>good health and new beginnings.</div>
  <div style="flex:1"></div>
  <div class="brand"><img src="../katkee-mark.svg"><div class="word">Kat<span>kee</span></div></div>
  <div class="tag">Story that connects.</div>
  <div style="height:90px"></div>` : `
  <div style="height:215px"></div>
  <div class="hindi" style="font-size:76px">शुभ धनतेरस</div>
  <div style="height:12px"></div>
  <div class="english" style="font-size:80px; line-height:1.05; text-align:center">Happy Dhanteras</div>
  <div style="height:26px"></div>
  <div class="rule"><i></i><b></b><i></i></div>
  <div style="height:22px"></div>
  <div class="wish" style="font-size:30px; line-height:1.45; max-width:800px">May your home shine with gold,<br>good health and new beginnings.</div>
  <div style="flex:1"></div>
  <div class="brand"><img src="../katkee-mark.svg" style="height:52px"><div class="word" style="font-size:44px">Kat<span>kee</span></div></div>
  <div style="height:56px"></div>`;
</script>
</body>
</html>
