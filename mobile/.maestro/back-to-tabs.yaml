# Goes back until the tab bar shows again (never past it, so the tour can't leave Katkee).
appId: com.katkee.app
---
- repeat:
    times: 4
    while:
      notVisible: "Messages.*"  # the tab, with or without an unread count
    commands:
      - pressKey: Back
      - waitForAnimationToEnd:
          timeout: 2000
