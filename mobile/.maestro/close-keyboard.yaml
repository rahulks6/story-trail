# Closes the on-screen keyboard. Android has a reliable "hide keyboard". An iPhone number pad has
# no Return key, so there it drags the form, which closes the keyboard (keyboardDismissMode).
appId: com.katkee.app
---
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 25%
          end: 50%, 40%
          duration: 300
