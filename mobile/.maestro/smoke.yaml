# The walk-through run on virtual iPhones by .github/workflows/ios-e2e.yml and on Android
# emulators by .github/workflows/android-e2e.yml: sign up a throwaway account (deleted again by
# the workflow), check the required "Verify your email" screen, verify the account with
# ci-verify.js, then visit every main screen in dark and light mode, taking a screenshot at each step. Steps marked optional
# record what's there without stopping the run, so one surprise doesn't hide the other screens.
appId: com.katkee.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Log in"
    timeout: 60000
- takeScreenshot: 01-login

- tapOn: ".*Sign up.*"
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 15000
- takeScreenshot: 02-signup
# The keyboard is closed after each field (an iPhone number pad has no Return key and covers the
# fields below it on a small screen).
- tapOn: "Display name"
- inputText: "Katkee iPhone Test"
- runFlow:
    file: close-keyboard.yaml
    env:
      TITLE: "Create your account"
- tapOn: "Username"
- inputText: ${USERNAME}
- runFlow:
    file: close-keyboard.yaml
    env:
      TITLE: "Create your account"
- tapOn: "Email"
- inputText: ${EMAIL}
- runFlow:
    file: close-keyboard.yaml
    env:
      TITLE: "Create your account"
- tapOn: "Date of birth"
- inputText: "01011995"
- runFlow:
    file: close-keyboard.yaml
    env:
      TITLE: "Create your account"
- tapOn: "Password"
- inputText: ${PASSWORD}
- runFlow:
    file: close-keyboard.yaml
    env:
      TITLE: "Create your account"
- takeScreenshot: 03-signup-filled
- scrollUntilVisible:
    element: "Sign up"
    optional: true
- tapOn: "Sign up"

- extendedWaitUntil:
    visible: "Verify your email"
    timeout: 45000
- takeScreenshot: 04-verify-email
# A new account can't skip this: no "Later", only a way to fix the email or log out.
# Tapping the title closes the keyboard (Android's "hide keyboard" acts as Back when it's already closed).
- tapOn: "Verify your email"
- assertVisible: "Wrong email? Change it"
- assertNotVisible: "Later"
- tapOn: "Wrong email? Change it"
- takeScreenshot: 04b-change-email
# Tapping the title closes the keyboard (Android's "hide keyboard" acts as Back when it's already closed).
- tapOn: "Change your email"
- tapOn: "Cancel"
# Verified out of band (ci-verify.js), then reopened: the app now opens on Home.
- runScript: ci-verify.js
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Home"
    timeout: 30000
# A new account is offered Nearby Stories a few seconds after Home first opens.
- extendedWaitUntil:
    visible: "Not now"
    timeout: 15000
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-home

- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-search

- tapOn: "DM"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-messages

- tapOn: "Create a Story"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-create
- tapOn:
    text: "Close"
    optional: true

- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-profile

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 11-settings
- scrollUntilVisible:
    element: "Appearance"
    optional: true
- takeScreenshot: 12-settings-lower
- tapOn: "Appearance"
- takeScreenshot: 13-appearance-sheet
- tapOn: "Light"
- tapOn:
    text: "OK"
    optional: true

# Reopen Katkee to see light mode (an iPhone app can't restart itself).
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 14-home-light
- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 15-profile-light
- tapOn: "DM"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 16-messages-light
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 17-search-light
