# The walk-through run on virtual iPhones by .github/workflows/ios-e2e.yml and on Android
# emulators by .github/workflows/android-e2e.yml: sign up a throwaway account (deleted again by
# the workflow), check the required "Verify your email" screen, verify the account with
# ci-verify.js, then visit every main screen in dark and light mode, taking a screenshot at each step. Steps marked optional
# record what's there without stopping the run, so one surprise doesn't hide the other screens.
appId: com.katkee.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# An emulator's own "isn't responding" dialog (not Katkee's) is waited out.
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Log in"
    timeout: 60000
- takeScreenshot: 01-login

# A slow virtual iPhone can miss a tap during its first launch: tap again if nothing changed.
- tapOn:
    text: ".*Sign up.*"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 30000
- takeScreenshot: 02-signup
# The keyboard is closed after each field (an iPhone number pad has no Return key and covers the
# fields below it on a small screen).
- tapOn: "Display name"
- inputText: "Katkee iPhone Test"
- runFlow: close-keyboard.yaml
- tapOn: "Username"
- inputText: ${USERNAME}
- runFlow: close-keyboard.yaml
- tapOn: "Email"
- inputText: ${EMAIL}
- runFlow: close-keyboard.yaml
- tapOn: "Date of birth"
- inputText: "01011995"
- runFlow: close-keyboard.yaml
- tapOn: "Password"
- inputText: ${PASSWORD}
- runFlow: close-keyboard.yaml
- takeScreenshot: 03-signup-filled
- scrollUntilVisible:
    element: "Sign up"
    optional: true
- tapOn: "Sign up"

- extendedWaitUntil:
    visible: "Verify your email"
    timeout: 45000
- takeScreenshot: 04-verify-email
# A new account can't skip this: no "Later", only a way to fix the email or log out.
# Tapping the title closes the keyboard (Android's "hide keyboard" acts as Back when it's already closed).
- tapOn: "Verify your email"
- assertVisible: "Change email"
- assertNotVisible: "Later"
- tapOn:
    text: "Change email"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Change your email"
    timeout: 15000
- takeScreenshot: 04b-change-email
# Tapping the title closes the keyboard (Android's "hide keyboard" acts as Back when it's already closed).
- tapOn: "Change your email"
- tapOn: "Cancel"
# Verified out of band (ci-verify.js); coming back to the app shows the next screen.
- runScript: ci-verify.js
# Android: reopened from cold. iPhone: to the home screen and back, without a cold start: the
# unsigned simulator build can't keep its session in the Keychain, and signing back in brings
# iOS's "Save password?" sheet, which cuts GitHub's virtual iPhone off from the test driver.
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp
      - launchApp
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Home
      - launchApp:
          stopApp: false
- extendedWaitUntil:
    visible: "(What are you into\\?|Forgot password\\?)"
    timeout: 30000
- runFlow: login-if-needed.yaml
# First run: pick interests, then people to follow.
- extendedWaitUntil:
    visible: "What are you into?"
    timeout: 30000
- tapOn: "Travel"
- tapOn: "Food"
- tapOn: "Music"
- takeScreenshot: 05a-onboarding-interests
- tapOn: "Next.*"
- extendedWaitUntil:
    visible: "People to follow"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05b-onboarding-people
- tapOn: "(Done|Start using Katkee)"
# Home, or the Nearby Stories offer already on top of it.
- extendedWaitUntil:
    visible: "(Home|Not now)"
    timeout: 30000
# A new account is offered Nearby Stories a few seconds after Home first opens.
- extendedWaitUntil:
    visible: "Not now"
    timeout: 15000
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-home

- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 06-search

- tapOn: "Messages"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 07-messages

- tapOn: "Create a Story"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 08-create
- tapOn: "Close camera"

- tapOn: "Profile"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 09-profile

- tapOn: "Settings"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 11-settings
- scrollUntilVisible:
    element: "Appearance"
    optional: true
- takeScreenshot: 12-settings-lower
- tapOn: "Appearance"
- takeScreenshot: 13-appearance-sheet
- tapOn: "Light"
- tapOn:
    text: "OK"
    optional: true

# Reopen Katkee to see light mode. Android only: on GitHub's virtual iPhones, closing and
# reopening the app (and iOS's own "Save password?" sheet on signing back in) loses the test
# driver's connection to the device. The screens are the same code on both platforms, and
# Android's run covers them in light mode.
- runFlow:
    when:
      platform: Android
    commands:
      - stopApp
      - launchApp
      - extendedWaitUntil:
          visible: "(Home|Forgot password\\?)"
          timeout: 30000
      - runFlow: login-if-needed.yaml
      - extendedWaitUntil:
          visible: "Home"
          timeout: 30000
      - takeScreenshot: 14-home-light
      - tapOn: "Profile"
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: 15-profile-light
      - tapOn: "Messages"
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: 16-messages-light
      - tapOn: "Search"
      - waitForAnimationToEnd:
          timeout: 5000
      - takeScreenshot: 17-search-light
