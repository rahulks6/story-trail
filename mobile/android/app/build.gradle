apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Android app configuration. See
 * https://reactnative.dev/docs/react-native-gradle-plugin for every option.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 shrinking stays off until a release build has been exercised on a device:
 * an over-eager keep rule failure only shows up at runtime.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC), used only when Hermes is disabled.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Store version. CI passes -PkatkeeVersionCode=<monotonic int> and
 * -PkatkeeVersionName=<semver>; local builds fall back to 1 / "1.0".
 * Google Play rejects an upload whose versionCode is not higher than the last one.
 */
def katkeeVersionCode = (project.findProperty("katkeeVersionCode") ?: "1").toString().toInteger()
def katkeeVersionName = (project.findProperty("katkeeVersionName") ?: "1.0").toString()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.katkee"
    defaultConfig {
        applicationId "com.katkee.development"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode katkeeVersionCode
        versionName katkeeVersionName
    }
    signingConfigs {
        release {
            // Private upload key supplied by the build environment only; never committed.
            if (System.getenv('KATKEE_UPLOAD_STORE_FILE')) {
                storeFile file(System.getenv('KATKEE_UPLOAD_STORE_FILE'))
                storePassword System.getenv('KATKEE_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('KATKEE_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('KATKEE_UPLOAD_KEY_PASSWORD')
            }
        }
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Never falls back to the public debug key: an unsigned config fails the build.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
    packaging {
        jniLibs {
            // Store .so files uncompressed and page-aligned in the APK so the
            // loader can map them directly on 16 KB page-size devices.
            useLegacyPackaging false
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Never sign a release with the public development key, an unconfirmed
// identifier or an unset production API origin.
tasks.register('validateKatkeeRelease', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'node', 'scripts/check-release.cjs', '--android'
}
tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') task.dependsOn('validateKatkeeRelease')
}
