# Optional provider configuration; retain default-off behavior until accounts are configured.
services:
  backend:
    environment:
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      PHONE_AUTH_ENABLED: ${PHONE_AUTH_ENABLED:-false}
      PHONE_AUTH_COUNTRIES: ${PHONE_AUTH_COUNTRIES:-}
      PHONE_IDENTITY_SECRET: ${PHONE_IDENTITY_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      PHONE_OTP_CODE_LENGTH: ${PHONE_OTP_CODE_LENGTH:-6}
      PHONE_OTP_DAILY_LIMIT: ${PHONE_OTP_DAILY_LIMIT:-100}
